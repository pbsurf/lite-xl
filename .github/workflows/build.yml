name: CI

# Pushes and PRs build Linux x86_64 and Windows x86_64 (MSVC). The other platforms
# (macOS, Windows MSYS2) build only when started by hand with "all_platforms" checked.

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also build macOS and Windows (MSYS2)
        type: boolean
        default: false

jobs:
  build_linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # packaging runs in the container too: it needs meson, which the runner lacks
      - name: Build and Package
        uses: docker://ghcr.io/lite-xl/lite-xl-build-box-manylinux:v4
        with:
          entrypoint: /entrypoint.sh
          args: |
            bash scripts/build.sh --debug --forcefallback --portable
            bash scripts/package.sh --debug --binary

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: lite-xl-linux-x86_64
          path: lite-xl-linux-x86_64-portable.tar.gz
          compression-level: 0

  build_windows_msvc:
    name: Windows (x86_64) (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install meson and ninja
        run: pip install --no-cache-dir meson ninja

      - name: Install pkgconf
        run: vcpkg install pkgconf:x64-windows-release

      # https://github.com/ilammy/msvc-dev-cmd?tab=readme-ov-file#name-conflicts-with-shell-bash
      - name: Set environment variables
        run: |
          echo "PKG_CONFIG=C:\vcpkg\installed\x64-windows-release\tools\pkgconf\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CC_LD=$((Get-Command link.exe).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: bash scripts/build.sh --debug --forcefallback --portable -b build

      - name: Package
        run: |
          meson install --skip-subprojects -C build --destdir "$PWD\lite-xl"
          7z a -mx=9 lite-xl-windows-x86_64-msvc.zip lite-xl

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: lite-xl-windows-x86_64-msvc
          path: lite-xl-windows-x86_64-msvc.zip
          compression-level: 0

  build_macos:
    name: macOS
    if: ${{ inputs.all_platforms }}
    strategy:
      matrix:
        config:
          - { arch: x86_64, runner: macos-15-intel }
          - { arch: arm64, runner: macos-15 }

    runs-on: ${{ matrix.config.runner }}
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          brew install bash md5sha1sum
          pip install meson ninja dmgbuild

      - name: Build
        run: bash scripts/build.sh --bundle --debug --forcefallback

      - name: Create DMG Image
        run: bash scripts/package.sh --debug --dmg

      - name: Upload DMG Image
        uses: actions/upload-artifact@v5
        with:
          name: macOS DMG Images (${{ matrix.config.arch }})
          path: lite-xl-macos-${{ matrix.config.arch }}.dmg
          compression-level: 0

  build_macos_universal:
    name: macOS (Universal)
    if: ${{ inputs.all_platforms }}
    runs-on: macos-15
    needs: build_macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Download artifacts
        uses: actions/download-artifact@v6
        id: download
        with:
          pattern: macOS DMG Images *
          merge-multiple: true
          path: dmgs-original

      - name: Make universal bundles
        run: bash scripts/make-universal-binaries.sh ${{ steps.download.outputs.download-path }} lite-xl-macos-universal

      - name: Upload DMG Image
        uses: actions/upload-artifact@v5
        with:
          name: macOS DMG Images (Universal)
          path: lite-xl-macos-universal.dmg
          compression-level: 0

  build_windows_msys2:
    name: Windows (x86_64) (MSYS2)
    if: ${{ inputs.all_platforms }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            git
            zip
            patch
          pacboy: >-
            gcc:p
            meson:p
            cmake:p
            ninja:p
            pkg-config:p
            ca-certificates:p

      - name: Build
        run: bash scripts/build.sh -U --debug --forcefallback

      - name: Package
        run: bash scripts/package.sh --debug --binary

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: lite-xl-windows-x86_64-msys2
          path: lite-xl-windows-x86_64.zip
          compression-level: 0
