name: Release

on:
  push:
    tags:
      - v[0-9]+.*

  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        default: v2.1.8
        required: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Version
        id: tag
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          fi

      - name: Update Tag
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ steps.tag.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/generate-release-notes.sh --debug --version ${{ steps.tag.outputs.version }}

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: Lite XL ${{ steps.tag.outputs.version }}
          tag: ${{ steps.tag.outputs.version }}
          draft: true
          bodyFile: release-notes.md
          allowUpdates: true

  build_linux:
    name: Linux
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${{ needs.release.outputs.version }}" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$PWD/.ccache" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      # disabled because this will break our own Python install
      - name: Python Setup
        if: false
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # disabled because the container has up-to-date packages
      - name: Update Packages
        if: false
        run: sudo apt-get update

      # disabled as the dependencies are already installed
      - name: Install Dependencies
        if: false
        run: |
          bash scripts/install-dependencies.sh --debug
          sudo apt-get install -y ccache

      # the CMake build, with SDL, FreeType and PCRE2 built in; in the manylinux build box,
      # whose old glibc the binary then needs at least
      - name: Build and Package
        uses: docker://ghcr.io/lite-xl/lite-xl-build-box-manylinux:v4
        with:
          entrypoint: /entrypoint.sh
          args: |
            cmake --version
            bash scripts/release-linux.sh --version ${INSTALL_REF} --debug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux Artifacts
          path: |
            lite-xl-${{ env.INSTALL_REF }}-linux-x86_64-portable.tar.gz
            lite-xl-${{ env.INSTALL_REF }}-addons-linux-x86_64-portable.tar.gz
            LiteXL-${{ env.INSTALL_REF }}-x86_64.AppImage
            LiteXL-${{ env.INSTALL_REF }}-addons-x86_64.AppImage

  build_macos:
    name: macOS
    needs: release
    strategy:
      matrix:
        config:
          - { arch: x86_64, runner: macos-13 } # macos-13 uses x86_64
          - { arch: arm64, runner: macos-14 } # macos-14 / latest uses M1

    runs-on: ${{ matrix.config.runner }}
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: System Information
        run: |
          system_profiler SPSoftwareDataType
          bash --version
          gcc -v
          xcodebuild -version

      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${{ needs.release.outputs.version }}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=lite-xl-${{ needs.release.outputs.version }}-macos-${{ matrix.config.arch }}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME_ADDONS=lite-xl-${{ needs.release.outputs.version }}-addons-macos-${{ matrix.config.arch }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          brew install bash md5sha1sum cmake
          pip install meson ninja dmgbuild

      - name: Build
        run: |
          bash --version
          bash scripts/build.sh --bundle --debug --forcefallback --release --lto

      - name: Create DMG Image
        run: |
          bash scripts/package.sh --version ${INSTALL_REF} --debug --dmg --release
          bash scripts/package.sh --version ${INSTALL_REF} --debug --addons --dmg --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS DMG Images (${{ matrix.config.arch }})
          path: |
            ${{ env.INSTALL_NAME }}.dmg
            ${{ env.INSTALL_NAME_ADDONS }}.dmg

  build_macos_universal:
    name: macOS (Universal)
    needs: [release, build_macos]
    runs-on: macos-14

    steps:
      - name: System Information
        run: |
          system_profiler SPSoftwareDataType
          bash --version
          gcc -v
          xcodebuild -version

      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_BASE=lite-xl-${{ needs.release.outputs.version }}-macos" >> "$GITHUB_ENV"
          echo "INSTALL_BASE_ADDONS=lite-xl-${{ needs.release.outputs.version }}-addons-macos" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        id: download
        with:
          pattern: macOS DMG Images *
          merge-multiple: true
          path: dmgs-original

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Prepare DMG Images
        run: |
          mkdir -p dmgs-addons dmgs-normal
          mv -v "${{ steps.download.outputs.download-path }}/$INSTALL_BASE-"{x86_64,arm64}.dmg dmgs-normal
          mv -v "${{ steps.download.outputs.download-path }}/$INSTALL_BASE_ADDONS-"{x86_64,arm64}.dmg dmgs-addons

      - name: Create Universal DMGs
        run: |
          bash --version
          bash scripts/make-universal-binaries.sh dmgs-normal "$INSTALL_BASE-universal"
          bash scripts/make-universal-binaries.sh dmgs-addons "$INSTALL_BASE_ADDONS-universal"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS DMG Images (Universal)
          path: |
            ${{ env.INSTALL_BASE }}-universal.dmg
            ${{ env.INSTALL_BASE_ADDONS }}-universal.dmg

  # the CMake build with MSVC, every dependency built statically (CMakeLists.txt); x86_64
  build_windows_msvc:
    name: Windows (MSVC)
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "INSTALL_REF=${{ needs.release.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INSTALL_NAME=lite-xl-${{ needs.release.outputs.version }}-windows-x86_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INSTALL_NAME_ADDONS=lite-xl-${{ needs.release.outputs.version }}-addons-windows-x86_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        run: |
          # CMake and Ninja from Visual Studio, on PATH in its developer environment
          cmake --version
          ninja --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLITE_SPELLCHECK=OFF
          cmake --build build --target lite-xl

      # the installers package lite-xl\ (build\scripts\innosetup.iss, configured by CMake)
      - name: Package
        run: |
          cmake --install build --prefix "$PWD\lite-xl"
          7z a -mx=9 "${env:INSTALL_NAME}.zip" lite-xl
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /dArch=x64compatible /O"$PWD" /F"LiteXL-${env:INSTALL_REF}-x86_64-setup" build\scripts\innosetup.iss

      - name: Add Addons
        shell: bash
        run: |
          source scripts/common.sh
          addons_download build
          addons_install build lite-xl/data

      - name: Package With Addons
        run: |
          7z a -mx=9 "${env:INSTALL_NAME_ADDONS}.zip" lite-xl
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /dArch=x64compatible /O"$PWD" /F"LiteXL-${env:INSTALL_REF}-addons-x86_64-setup" build\scripts\innosetup.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows Builds (MSVC)
          path: |
            ${{ env.INSTALL_NAME }}.zip
            ${{ env.INSTALL_NAME_ADDONS }}.zip
            LiteXL-${{ env.INSTALL_REF }}-x86_64-setup.exe
            LiteXL-${{ env.INSTALL_REF }}-addons-x86_64-setup.exe

  upload_artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs:
      [release, build_linux, build_macos, build_macos_universal, build_windows_msvc]
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release.outputs.version }}
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: "*.exe,*.zip,*.tar.gz,*.dmg,*.AppImage"
